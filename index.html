<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Modern Calculator</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main class="Calculator">
        <header class="header">
            <div>
                <h1>Calculator</h1>
                <p>MODERN EDITION</p>
            </div>
            <div class="calculator-icon">*</div>
        </header>
        <section class="display">
            <p class="previous">Ready to calculate</p>
            <input
            type="text"
            class="screen"
            placeholder="0"
            aria-label="Calculator display"
            >
            
        </section>
        <section class="buttons" aria-label="Calculator keys">
            <button class="utility">AC</button>
            <button class="utility">+/-</button>
            <button class="utility">%</button>
            <button class="operator">&divide;</button>
            <button>7</button>
            <button>8</button>
            <button>9</button>
            <button class="operator">&times;</button>
            <button>4</button>
            <button>5</button>
            <button>6</button>
            <button class="operator">-</button>
            <button>1</button>
            <button>2</button>
            <button>3</button>
            <button class="operator">+</button>
            <button class="delete">*</button>
            <button>0</button>
            <button>.</button>
            <button class="equals">=</button>

        </section>
        <footer>
            designed with HTML&amp; css
        </footer>
    </main>
    
</body>
</html>
